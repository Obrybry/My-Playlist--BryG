<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b09">
  <title>BryG — My Little World</title>

  <style>
    :root {
      --green: #48ff91;
      --bg: #080b09;
      --card: rgba(15, 20, 17, .88);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg) url("./1ef5fb379e681b2a065facc80421dafa.jpg")
        center/cover fixed no-repeat;
      color: white;
      font-family: Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .76);
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 45px 15px 25px;
    }

    header h1 {
      color: var(--green);
      font-size: clamp(42px, 10vw, 65px);
      margin: 0;
      letter-spacing: 5px;
      text-shadow: 0 0 20px #48ff9144;
    }

    header p {
      color: #c5c5c5;
      letter-spacing: 2px;
    }

    main {
      width: min(92%, 650px);
      margin: auto;
    }

    .section {
      background: var(--card);
      border: 1px solid #48ff9133;
      border-radius: 18px;
      padding: 20px;
      margin: 20px 0;
      backdrop-filter: blur(10px);
    }

    h2 {
      font-size: 17px;
      color: var(--green);
      margin-top: 0;
    }

    iframe {
      width: 100%;
      border: 0;
      border-radius: 12px;
      margin-top: 10px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .photo {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      border-radius: 12px;
      background: #171b18;
      aspect-ratio: 1;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .25s;
    }

    .photo:active img {
      transform: scale(.96);
    }

    .reaction {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: #000b;
      border-radius: 20px;
      padding: 5px 9px;
    }

    .pop {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 55px;
      pointer-events: none;
      opacity: 0;
    }

    .pop.animate {
      animation: pop .7s ease-out;
    }

    @keyframes pop {
      0% { opacity: 0; transform: scale(.3); }
      35% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0; transform: scale(1.8); }
    }

    #visitor-counter {
      text-align: center;
      padding: 22px 10px;
      margin-top: 25px;
      color: white;
    }

    #visit-count {
      color: var(--green);
      font-size: 29px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 12px 10px 35px;
      color: #aaa;
      line-height: 1.9;
    }

    footer strong {
      color: var(--green);
      letter-spacing: 3px;
    }
  </style>
</head>

<body>
  <header>
    <h1>BryG</h1>
    <p>MY MUSIC · MY WORLD · MY STORY</p>
  </header>

  <main>
    <section class="section">
      <h2>🎧 MY PLAYLISTS</h2>

      <iframe
        src="https://open.spotify.com/embed/playlist/0HCgtcdgiD1j8Zrgsml4rX?utm_source=generator"
        height="352"
        loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>

      <iframe
        src="https://open.spotify.com/embed/playlist/3ek65NRqWq1WYjGUvCUUi7?utm_source=generator"
        height="352"
        loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>

      <iframe
        src="https://open.spotify.com/embed/playlist/37i9dQZF1DX186v583rmzp?utm_source=generator"
        height="352"
        loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>
    </section>

    <section class="section">
      <h2>📸 LITTLE MEMORIES</h2>

      <div class="gallery">
        <div class="photo" data-emoji="❤️">
          <img src="./foto/1eb5354918d8ad241ae7be4305acec60.jpg"
               alt="Memory 1" loading="lazy">
          <span class="reaction">❤️</span>
          <span class="pop">❤️</span>
        </div>

        <div class="photo" data-emoji="😂">
          <img src="./foto/2f00ea44893b313d21fb5fdafb5b2b11.jpg"
               alt="Memory 2" loading="lazy">
          <span class="reaction">😂</span>
          <span class="pop">😂</span>
        </div>

        <div class="photo" data-emoji="👍">
          <img src="./foto/f35b7778f2cb296483c0bb33b9fb85c2.jpg"
               alt="Memory 3" loading="lazy">
          <span class="reaction">👍</span>
          <span class="pop">👍</span>
        </div>

        <div class="photo" data-emoji="😱">
          <img src="./foto/fc92879c124579a56dcab9059c5745f3.jpg"
               alt="Memory 4" loading="lazy">
          <span class="reaction">😱</span>
          <span class="pop">😱</span>
        </div>
      </div>
    </section>

    <!-- PUBLIC VISITOR COUNT -->
    <section id="visitor-counter" class="section">
      <div style="font-size:13px;letter-spacing:2px;">
        👁️ TOTAL VISITS
      </div>

      <div id="visit-count" style="margin:10px 0;">
        Menghubungkan...
      </div>

      <div style="font-size:12px;color:#aaa;">
        Thanks for visiting my little world.
      </div>
    </section>
  </main>

  <footer>
    <div>WKWKW 😂</div>
    <strong>— BryG —</strong>
  </footer>

  <script>
    // Emoji reaction animation
    document.querySelectorAll(".photo").forEach(photo => {
      photo.addEventListener("click", () => {
        const pop = photo.querySelector(".pop");
        pop.classList.remove("animate");
        void pop.offsetWidth;
        pop.classList.add("animate");
      });
    });
  </script>

  <!--
    VISITOR COUNTER:
    Penghitung belum aktif sampai GoatCounter dikonfigurasi.
    Ganti YOUR-CODE dengan kode situs GoatCounter milikmu.
  -->
  <script>
    const GOATCOUNTER_CODE = "YOUR-CODE";

    if (GOATCOUNTER_CODE !== "YOUR-CODE") {
      const script = document.createElement("script");
      script.dataset.goatcounter =
        "https://" + GOATCOUNTER_CODE + ".goatcounter.com/count";
      script.async = true;
      script.src = "//gc.zgo.at/count.js";

      script.onload = () => {
        document.getElementById("visit-count").textContent =
          "Statistik terhubung";
      };

      script.onerror = () => {
        document.getElementById("visit-count").textContent =
          "Belum tersedia";
      };

      document.body.appendChild(script);
    } else {
      document.getElementById("visit-count").textContent =
        "Aktifkan GoatCounter";
    }
  </script>
</body>
</html>
