<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b09">
<title>BryG</title>

<style>
:root {
  --green: #48ff91;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080b09 url("./1ef5fb379e681b2a065facc80421dafa.jpg")
    center / cover fixed no-repeat;
  color: white;
  font-family: Arial, sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .76);
  z-index: -1;
}

header {
  text-align: center;
  padding: 42px 15px 25px;
}

header h1 {
  margin: 0;
  color: var(--green);
  font-size: clamp(42px, 10vw, 65px);
  letter-spacing: 5px;
  text-shadow: 0 0 20px #48ff9144;
}

header p {
  color: #ccc;
  font-size: 12px;
  letter-spacing: 2px;
}

main {
  width: min(92%, 650px);
  margin: auto;
}

.section {
  margin: 20px 0;
  padding: 12px;
  border: 1px solid #48ff9133;
  border-radius: 18px;
  background: rgba(10, 15, 12, .9);
  backdrop-filter: blur(10px);
}

/* PLAYLIST GESER KE KANAN */
.playlist-slider {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 10px;
}

.playlist-slider iframe {
  display: block;
  flex: 0 0 88%;
  width: 88%;
  min-width: 88%;
  height: 352px;
  border: 0;
  border-radius: 12px;
  margin: 0;
  scroll-snap-align: start;
}

.playlist-slider::-webkit-scrollbar {
  height: 5px;
}

.playlist-slider::-webkit-scrollbar-thumb {
  background: var(--green);
  border-radius: 10px;
}

/* FOTO LANGSUNG DI BAWAH PLAYLIST */
.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.photo {
  position: relative;
  overflow: hidden;
  aspect-ratio: 1;
  border-radius: 12px;
  background: #171b18;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .2s;
}

.photo:active img {
  transform: scale(.96);
}

.reaction {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 5px 9px;
  background: #000b;
  border-radius: 20px;
}

.pop {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 55px;
  pointer-events: none;
  opacity: 0;
}

.pop.animate {
  animation: emojiPop .7s ease-out;
}

@keyframes emojiPop {
  0% {
    opacity: 0;
    transform: scale(.3);
  }
  35% {
    opacity: 1;
    transform: scale(1.3);
  }
  100% {
    opacity: 0;
    transform: scale(1.8);
  }
}

footer {
  text-align: center;
  padding: 18px 10px 35px;
  color: #aaa;
  line-height: 2;
}

footer strong {
  color: var(--green);
  letter-spacing: 3px;
}
</style>
</head>

<body>

<header>
  <h1>BryG</h1>
  <p>MY MUSIC · MY WORLD · MY STORY</p>
</header>

<main>

  <!-- PLAYLIST SPOTIFY -->
  <section class="section">
    <div class="playlist-slider">

      <iframe
        src="https://open.spotify.com/embed/playlist/0HCgtcdgiD1j8Zrgsml4rX?utm_source=generator"
        title="Spotify Playlist 1"
        loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>

      <iframe
        src="https://open.spotify.com/embed/playlist/3ek65NRqWq1WYjGUvCUUi7?utm_source=generator"
        title="Spotify Playlist 2"
        loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>

      <iframe
        src="https://open.spotify.com/embed/playlist/37i9dQZF1DX186v583rmzp?utm_source=generator"
        title="Spotify Playlist 3"
        loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>

    </div>
  </section>

  <!-- FOTO TANPA JUDUL -->
  <section class="section">
    <div class="gallery">

      <div class="photo">
        <img
          src="./foto/1eb5354918d8ad241ae7be4305acec60.jpg"
          alt="Foto 1"
          loading="lazy">
        <span class="reaction">❤️</span>
        <span class="pop">❤️</span>
      </div>

      <div class="photo">
        <img
          src="./foto/2f00ea44893b313d21fb5fdafb5b2b11.jpg"
          alt="Foto 2"
          loading="lazy">
        <span class="reaction">😂</span>
        <span class="pop">😂</span>
      </div>

      <div class="photo">
        <img
          src="./foto/f35b7778f2cb296483c0bb33b9fb85c2.jpg"
          alt="Foto 3"
          loading="lazy">
        <span class="reaction">👍</span>
        <span class="pop">👍</span>
      </div>

      <div class="photo">
        <img
          src="./foto/fc92879c124579a56dcab9059c5745f3.jpg"
          alt="Foto 4"
          loading="lazy">
        <span class="reaction">😱</span>
        <span class="pop">😱</span>
      </div>

    </div>
  </section>

</main>

<footer>
  <div>W</div>
  <strong>— BryG —</strong>
</footer>

<script>
document.querySelectorAll(".photo").forEach(photo => {
  photo.addEventListener("click", () => {
    const pop = photo.querySelector(".pop");
    if (!pop) return;

    pop.classList.remove("animate");
    void pop.offsetWidth;
    pop.classList.add("animate");
  });
});
</script>

</body>
</html>
